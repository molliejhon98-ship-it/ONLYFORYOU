<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Message</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
  overflow:hidden;

  /* 🎀 HELLO KITTY BACKGROUND */
  background-color:#ffd6e7;
  background-image:url('kitty.png');
  background-size:120px;
  background-repeat:repeat;
}

/* overlay for readability */
body::before{
  content:'';
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.35);
  z-index:0;
}

/* 💌 QUESTION CARD */
.box{
  max-width:520px;
  z-index:2;
  background:rgba(255,255,255,0.95);
  color:#ff4d88;
  padding:30px 25px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
  backdrop-filter:blur(6px);
  animation:fadeCard 0.6s ease;
}

@keyframes fadeCard{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

.box h2{
  font-size:1.8rem;
  margin-bottom:20px;
  font-weight:bold;
  color:#ff2f7a;
  text-shadow:0 2px 5px rgba(255,105,180,0.3);
}

/* 🎀 BUTTONS */
button{
  margin:10px;
  padding:12px 22px;
  border:none;
  border-radius:25px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  background:linear-gradient(145deg,#ff6fa5,#ff9ec4);
  color:white;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}

/* 💖 BIG PINK HEART */
.heart{
  position:fixed;
  width:75vmin;
  height:75vmin;
  background:linear-gradient(145deg,#ff6fa5,#ff9ec4);
  transform:rotate(-45deg) scale(0);
  top:50%;
  left:50%;
  margin:-37.5vmin;
  z-index:1;
  box-shadow:0 0 50px rgba(255,105,180,0.7);
  animation:popHeart 0.8s ease forwards, beat 1.2s ease-in-out infinite 0.8s;
}

.heart::before,
.heart::after{
  content:'';
  position:absolute;
  width:75vmin;
  height:75vmin;
  background:linear-gradient(145deg,#ff6fa5,#ff9ec4);
  border-radius:50%;
}

.heart::before{
  top:-37.5vmin;
  left:0;
}

.heart::after{
  left:37.5vmin;
  top:0;
}

@keyframes popHeart{
  0%{transform:rotate(-45deg) scale(0);}
  70%{transform:rotate(-45deg) scale(1.15);}
  100%{transform:rotate(-45deg) scale(1);}
}

@keyframes beat{
  0%,100%{transform:rotate(-45deg) scale(1);}
  50%{transform:rotate(-45deg) scale(1.05);}
}

/* 💌 FINAL MESSAGE */
.message{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  opacity:0;
  z-index:2;
  animation:fadeIn 1s ease forwards;
  animation-delay:0.6s;
  width:60vmin;
  font-size:1.2rem;
}

@keyframes fadeIn{
  to{opacity:1;}
}
</style>
</head>

<body>

<div class="box" id="content">
  <h2>🎀 Hey you… is your name Diana? 💖</h2>
  <button onclick="answer1(true)">Yes</button>
  <button onclick="answer1(false)">No</button>
</div>

<audio id="music" src="music.mp3"></audio>

<script>

window.onload = () => {
  alert("Hey... I have something for you 👀");
};

function answer1(isYes){
  if(isYes){
    content.innerHTML = `
      <h2>💭 Are you really sure? 😏</h2>
      <button onclick="answer2(true)">Yes</button>
      <button onclick="answer2(false)">No</button>
    `;
  }else{
    thief();
  }
}

function answer2(isYes){
  if(isYes){
    showMessage();
  }else{
    thief();
  }
}

function thief(){
  alert("GET OUT OF HERE YOUUUU THIEF 😡");
  location.reload();
}

function showMessage(){
  document.getElementById("music").play();

  content.style.display="none";

  const heart=document.createElement("div");
  heart.className="heart";
  document.body.appendChild(heart);

  const msg=document.createElement("div");
  msg.className="message";
  msg.innerHTML=`
    <h2>💌 For You</h2>
    <p>
      PLEASE READ<br><br>
      
      I don’t know if anyone’s told you this lately, but you carry a kind of strength that doesn’t always make noise, it shows in the way you keep going, even when things get heavy. You’ve been through more than most people see, and still, you stand with a quiet resilience that’s honestly beautiful. You are loved in ways you might not always notice, admired more than you realize, and deeply adored for who you are, not just for what you do. And I believe in you hmm completely, without hesitation.

Please don’t let other people’s opinions shrink you. They don’t get to define your worth, you already are something rare and incredible just as you are. I know I might just be a stranger, and maybe my words won’t mean much to you, but there’s something about you that stands ouT hmm you glow differently. Not louder, not brighter in an obvious way, but in a way that lingers, that stays with people.

I hope you remember your worth, even on the days it feels blurry. Don’t ever settle for less than what your heart knows you deserve. And even if one day I become just a passing memory you barely recall, I’ll still be here believing in everything you’re capable of. I’m genuinely excited for your future hehe for all the things you’ll become, achieve, and discover. You’re going to do amazing things, and you deserve every single one of them. ALWAYS REMEMBER THIS PHRASE 

"SI VIS AMARI, AMA."

 HAVE A GREAT DAY PO
    </p>
  `;
  document.body.appendChild(msg);
}

</script>

</body>
</html>
